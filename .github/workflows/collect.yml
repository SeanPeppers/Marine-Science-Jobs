name: Collect jobs

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # A hung source must not hold the runner for the 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run python -m marine_jobs.collect
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(date -u +%F)"
            git push
          fi
